    <style>
        /* === RESETARE ȘI SETĂRI GENERALE === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 15px; 
        }
        body {
            font-family: 'Aleo', serif;
            color: #111;
            background-color: #fff;
            overflow: hidden; 
            height: 100vh; 
            cursor: url('punct.png') 16 16, auto;   
        }

        a {
            color: #111;
            text-decoration: none;
            cursor: url('punct2.png') 16 16, pointer;
        }

        /* === LAYOUT BAZĂ === */
        .container {
            display: flex;
            flex-direction: column; 
            height: 100vh; 
        }

        .sidebar {
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 0 0 auto; 
        }

        /* === TITLU ȘI TEXT === */
        .sidebar-header h1 {
            /* Dimensiune fluidă corectată: minim 1rem, preferat 1.0vw, maxim 1.6rem */
            font-size: clamp(0.9rem, 1.0vw, 1.6rem); 
            font-weight: normal;
            margin: 0; 
            margin-bottom: 1rem;
            line-height: 1.1; 
        }
        .logo-link {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .logo-link:hover {
            text-decoration: none; /* Împiedică sublinierea la hover */
            opacity: 0.6; /* Face textul un pic mai pal pentru a arăta că e un link activ */
        }
        /* === LINK-UL DIN DREAPTA SUS (INFORMATIONS) === */
        .nav-informations {
            position: absolute; /* Îl scoate din ordinea normală și îl lasă să plutească */
            top: 10px; /* Perfect aliniat la aceeași înălțime cu numele tău */
            right: 10px; /* Lipit de dreapta pe ecranele mici */
            
            /* Preluăm exact fontul dinamic de la h1 */
            font-size: clamp(0.9rem, 1.0vw, 1.6rem); 
            font-weight: normal;
            line-height: 1.1; 
            
            /* Setări de link */
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s ease;
            z-index: 50; /* Ne asigurăm că stă deasupra imaginilor din galerie */
        }

        .nav-informations:hover {
            opacity: 0.6;
        }
        /* === TEXTUL CENTRAL JOS === */
        .bio-centrata {
            position: absolute;
            bottom: 10px; /* Distanța față de marginea de jos a ecranului */
            left: 50%;
            transform: translateX(-50%); /* Truc matematic pentru a centra perfect un element absolut */
            
            text-align: center;
            width: 90%;
            max-width: 600px; /* Nu lasă textul să se lățească prea mult pe ecrane mari */
            font-size: 0.8rem;
            
            z-index: 50; /* Îl ține deasupra galeriei de imagini */
            }

        /* === GALERIE SLIDESHOW === */
        .gallery {
            width: 100%;
            
            /* Tăiem 145px din înălțime (80px pentru sus + 65px pentru jos) */
            height: calc(100dvh - 160px); 
            
            position: absolute;
            
            /* O împingem mai jos pentru a face loc header-ului */
            top: 80px;
            left: 0;
            padding: 0 10px; /* Lăsăm padding doar pe laterale */
            z-index: 10;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            
            /* Cursorul personalizat (asigură-te că ai poza linked-arrows.png în același folder) */
            cursor: url('linked-arrows.png'), pointer; 
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            object-fit: contain;
            object-position: center;
            
            opacity: 0; 
            transition: opacity 0.2s ease-in-out; 
            z-index: 0;
        }

        .slide.active {
            opacity: 1; 
            z-index: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;  
            pointer-events: none; /* Lasă click-ul să treacă prin poză către container */
        }

        .caption {
            padding-top: 10px;
            font-size: 0.85rem;
            color: #555;
            height: 30px; 
        }

        /* === ADAPTARE PENTRU DESKTOP === */
        @media (min-width: 768px) {
            .container {
                flex-direction: row; 
            }
            .nav-informations {

            }
            .sidebar {

            }

                max-width: 250px; /* Îi limitează lățimea pentru a sta doar în zona textului, fără să intre peste galerie */
            }
        }
        body {

        }

        @keyframes aparitieLenta {

        }
        @media (max-width: 767px) {

            }

    </style>

    <!-- SCRIPT LOGICĂ SLIDESHOW CORECTAT (PAUZĂ STRICTĂ PE HOVER) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const slides = document.querySelectorAll('.slide');
            const slideshowContainer = document.querySelector('.slideshow-container');
            
            let currentIndex = 0;
            let slideInterval; 

            // Funcția pentru imaginea următoare
            function nextSlide() {
                slides[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % slides.length;
                slides[currentIndex].classList.add('active');
            }

            // Funcția pentru imaginea anterioară
            function prevSlide() {
                slides[currentIndex].classList.remove('active');
                currentIndex = (currentIndex - 1 + slides.length) % slides.length;
                slides[currentIndex].classList.add('active');
            }

            // Pornire timer (2 secunde)
            function startSlideshow() {
                clearInterval(slideInterval);
                slideInterval = setInterval(nextSlide, 1000); 
            }

            // Oprire timer (Pauză)
            function stopSlideshow() {
                clearInterval(slideInterval); 
            }

            // Inițializare automată la încărcarea paginii
            startSlideshow();

            // Când cursorul intră pe galerie -> PAUZĂ
            slideshowContainer.addEventListener('mouseenter', stopSlideshow);
            
            // Când cursorul iese de pe galerie -> RELUARE AUTOMATĂ
            slideshowContainer.addEventListener('mouseleave', startSlideshow);

            // Funcția principală de Click Zonal
            slideshowContainer.addEventListener('click', function(event) {
                const rect = slideshowContainer.getBoundingClientRect();
                const containerWidth = rect.width;
                const clickX = event.clientX - rect.left;
                
                // Schimbă imaginea stânga/dreapta
                if (clickX < containerWidth / 2) {
                    prevSlide();
                } else {
                    nextSlide();
                }
            });
        });
    </script>
